<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Shushawaty Maily | شووشەواتی مەیلی</title>
        <style>
            :root {
                  --teal: #0f4c5c;
                        --teal-dark: #09323d;
                              --gold: #d4af37;
                                    --bg: #f4f8f9;
                                          --card: #ffffff;
                                              }
                                                  * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
                                                      body { margin: 0; background: var(--bg); color: #1b262c; padding-bottom: 84px; }
                                                          .hero {
                                                                background: linear-gradient(135deg, var(--teal-dark), var(--teal));
                                                                      color: #fff; padding: 24px 16px; text-align: center;
                                                                            border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;
                                                                                }
                                                                                    .logo {
                                                                                          width: 76px; height: 76px; margin: 0 auto 10px; border-radius: 50%;
                                                                                                background: linear-gradient(135deg, var(--teal), #1f7a8c, var(--gold));
                                                                                                      border: 3px solid #fff; display: flex; align-items: center; justify-content: center;
                                                                                                            font-size: 32px; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
                                                                                                                }
                                                                                                                    .container { max-width: 640px; margin: 16px auto; padding: 0 14px; }
                                                                                                                        .card {
                                                                                                                              background: var(--card); border-radius: 18px; padding: 16px;
                                                                                                                                    margin-bottom: 16px; box-shadow: 0 4px 14px rgba(15,76,92,0.08);
                                                                                                                                        }
                                                                                                                                            .row { display: flex; gap: 8px; margin-bottom: 12px; }
                                                                                                                                                .tab-btn {
                                                                                                                                                      flex: 1; padding: 10px; border: 1px solid var(--teal); border-radius: 12px;
                                                                                                                                                            background: #fff; color: var(--teal); font-weight: bold; cursor: pointer;
                                                                                                                                                                }
                                                                                                                                                                    .tab-btn.active { background: var(--teal); color: #fff; }
                                                                                                                                                                        input, textarea {
                                                                                                                                                                              width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 12px;
                                                                                                                                                                                    margin-bottom: 10px; font-size: 14px;
                                                                                                                                                                                        }
                                                                                                                                                                                            .btn-gold {
                                                                                                                                                                                                  width: 100%; padding: 12px; border: none; border-radius: 12px;
                                                                                                                                                                                                        background: var(--gold); color: #111; font-weight: bold; font-size: 15px; cursor: pointer;
                                                                                                                                                                                                            }
                                                                                                                                                                                                                .btn-teal {
                                                                                                                                                                                                                      width: 100%; padding: 12px; border: none; border-radius: 12px;
                                                                                                                                                                                                                            background: var(--teal); color: #fff; font-weight: bold; font-size: 15px; cursor: pointer;
                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                    .product-img {
                                                                                                                                                                                                                                          width: 100%; height: 210px; object-fit: cover; border-radius: 14px; margin-bottom: 10px;
                                                                                                                                                                                                                                                background: #e2e8f0;
                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                        .price-badge {
                                                                                                                                                                                                                                                              display: inline-block; background: rgba(212,175,55,0.2); color: var(--teal-dark);
                                                                                                                                                                                                                                                                    padding: 6px 12px; border-radius: 10px; font-weight: bold; margin-bottom: 8px;
                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                            .bottom-nav {
                                                                                                                                                                                                                                                                                  position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
                                                                                                                                                                                                                                                                                        display: flex; border-top: 1px solid #e2e8f0; padding: 8px 0;
                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                .nav-item {
                                                                                                                                                                                                                                                                                                      flex: 1; text-align: center; background: none; border: none;
                                                                                                                                                                                                                                                                                                            font-weight: bold; color: #64748b; cursor: pointer; padding: 6px;
                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                    .nav-item.active { color: var(--teal); }
                                                                                                                                                                                                                                                                                                                        .hidden { display: none; }
                                                                                                                                                                                                                                                                                                                          </style>
                                                                                                                                                                                                                                                                                                                          </head>
                                                                                                                                                                                                                                                                                                                          <body>

                                                                                                                                                                                                                                                                                                                            <!-- بەشی چوونەژوورەوە -->
                                                                                                                                                                                                                                                                                                                              <div id="loginView">
                                                                                                                                                                                                                                                                                                                                  <div class="hero">
                                                                                                                                                                                                                                                                                                                                        <div class="logo">🥂</div>
                                                                                                                                                                                                                                                                                                                                              <h2>Shushawaty Maily</h2>
                                                                                                                                                                                                                                                                                                                                                    <p>شووشەواتی مەیلی — بڵاوکردنەوەی ڕۆژانەی کاڵاکانی دوکان</p>
                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                            <div class="container">
                                                                                                                                                                                                                                                                                                                                                                  <div class="card">
                                                                                                                                                                                                                                                                                                                                                                          <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                    <button id="modePhone" class="tab-btn active" onclick="setAuthMode('phone')">Zain / Korek / Asiacell</button>
                                                                                                                                                                                                                                                                                                                                                                                              <button id="modeGmail" class="tab-btn" onclick="setAuthMode('gmail')">Gmail</button>
                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                              <input id="authInput" type="text" placeholder="ژمارەی مۆبایل (0770 / 0750 / 0780)" />
                                                                                                                                                                                                                                                                                                                                                                                                                      <button class="btn-teal" onclick="loginUser()">چوونەژوورەوە بۆ دوکان</button>
                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- بەشی ناو ئەپ -->
                                                                                                                                                                                                                                                                                                                                                                                                                                      <div id="appView" class="hidden">
                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="hero">
                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="logo" style="width:58px;height:58px;font-size:24px;">🥂</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h3 style="margin:4px 0;">Shushawaty Maily</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <small id="activeAccountLabel"></small>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <!-- تاب ١: کاڵاکان و بڵاوکردنەوە -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="shopTab">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <h4>زیادکردنی کاڵای نوێ</h4>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input id="prodTitle" type="text" placeholder="ناوی کاڵا" />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <textarea id="prodDesc" rows="2" placeholder="زانیاری لەسەر کاڵاکە"></textarea>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input id="prodPrice" type="text" placeholder="نرخ (بۆ نموونە: ٢٥,٠٠٠ د.ع)" />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <input id="prodImage" type="file" accept="image/*" />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="btn-gold" onclick="addProduct()">بڵاوکردنەوەی کاڵا</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="productsList"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- تاب ٢: ئینفۆرمەیشن -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div id="infoTab" class="hidden">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3>زانیاریی دوکان (Information)</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p><strong>ناونیشان و شوێنی دوکان:</strong> [ناونیشانی دوکانەکەت لێرە بنووسە]</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p><strong>ژمارەی مۆبایل:</strong> [ژمارەی مۆبایلەکەت لێرە بنووسە]</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="bottom-nav">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="navShop" class="nav-item active" onclick="switchTab('shop')">کاڵاکان</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button id="navInfo" class="nav-item" onclick="switchTab('info')">ئینفۆرمەیشن</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          let authMode = 'phone';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const products = [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            title: 'سێتی شووشەواتی کریستاڵی',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    desc: 'کوالێتی بەرز و نەخشی زێڕین بۆ ڕازاندنەوەی ماڵ.',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            price: '٣٠,٠٠٠ د.ع',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    img: 'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=600'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function setAuthMode(mode) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        authMode = mode;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('modePhone').classList.toggle('active', mode === 'phone');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('modeGmail').classList.toggle('active', mode === 'gmail');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('authInput').placeholder =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  mode === 'phone' ? 'ژمارەی مۆبایل (0770 / 0750 / 0780)' : 'ناونیشانی Gmail';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function normalizeIraqPhone(raw) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let d = raw.replace(/[^0-9]/g, '');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (d.startsWith('00964')) d = d.slice(5);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            else if (d.startsWith('964')) d = d.slice(3);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  else if (d.startsWith('0')) d = d.slice(1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return '+964' + d;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function loginUser() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const val = document.getElementById('authInput').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!val) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const id = authMode === 'phone' ? normalizeIraqPhone(val) : val;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('activeAccountLabel').textContent = 'هەژمار: ' + id;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('loginView').classList.add('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('appView').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          renderProducts();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function addProduct() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const title = document.getElementById('prodTitle').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const desc = document.getElementById('prodDesc').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const price = document.getElementById('prodPrice').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const fileInput = document.getElementById('prodImage');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!title || !price) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const pushItem = (imgUrl) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              products.unshift({ title, desc, price, img: imgUrl });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById('prodTitle').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('prodDesc').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById('prodPrice').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              fileInput.value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      renderProducts();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (fileInput.files && fileInput.files[0]) {
