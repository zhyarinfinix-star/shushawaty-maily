<script>
(function () {
  var EMAILJS_PUBLIC_KEY = "2MMVlqbe3ak0ENMry";
  var EMAILJS_SERVICE_ID = "service_ackleif";
  var EMAILJS_TEMPLATE_ID = "template_hj6esyr";

  var USERS_KEY = "sm_users_v1";
  var SESSION_KEY = "sm_active_user";
  var POSTS_KEY = "sm_posts_v1";

  function byId(id) {
    return document.getElementById(id);
  }

  function readJson(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (err) {
      return fallback;
    }
  }

  function writeJson(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (err) {}
  }

  function getUsers() { return readJson(USERS_KEY, []); }
  function saveUsers(list) { writeJson(USERS_KEY, list); }
  function getSession() { return readJson(SESSION_KEY, null); }
  function setSession(u) { writeJson(SESSION_KEY, u); }
  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (err) {}
  }
  function getPosts() { return readJson(POSTS_KEY, []); }
  function savePosts(list) { writeJson(POSTS_KEY, list); }

  // باران لەسەر canvas
  (function initRain() {
    var canvas = byId("rainCanvas");
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");
    var w = 0, h = 0, drops = [];

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = Math.floor(window.innerWidth * dpr);
      h = canvas.height = Math.floor(window.innerHeight * dpr);
      var count = Math.min(80, Math.max(35, Math.floor(window.innerWidth / 8)));
      drops = [];
      for (var i = 0; i < count; i++) {
        drops.push({
          x: Math.random() * w,
          y: Math.random() * h,
          len: (10 + Math.random() * 14) * dpr,
          speed: (8 + Math.random() * 10) * dpr,
          alpha: 0.14 + Math.random() * 0.24,
          lw: Math.max(1, 1.1 * dpr)
        });
      }
    }

    function step() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < drops.length; i++) {
        var d = drops[i];
        ctx.strokeStyle = "rgba(255,255,255," + d.alpha + ")";
        ctx.lineWidth = d.lw;
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x, d.y + d.len);
        ctx.stroke();

        d.y += d.speed;
        if (d.y > h) {
          d.y = -d.len;
          d.x = Math.random() * w;
        }
      }
      requestAnimationFrame(step);
    }

    resize();
    window.addEventListener("resize", resize);
    requestAnimationFrame(step);
  })();

  var authShell = byId("authShell");
  var mainAppShell = byId("mainAppShell");
  var activeUserLabel = byId("activeUserLabel");

  var loginForm = byId("loginForm");
  var registerForm = byId("registerForm");
  var forgotForm = byId("forgotForm");
  var otpView = byId("otpView");
  var resetFields = byId("resetFields");
  var statusMsg = byId("statusMsg");
  var otpText = byId("otpText");
  var otpBox = byId("otpBox");
  var otpInputs = Array.prototype.slice.call(document.querySelectorAll(".otp-input"));
  var resendBtn = byId("resendBtn");

  var pendingFlow = null;
  var pendingPayload = null;
  var currentOtp = "";
  var timerId = null;

  function setStatus(msg, type) {
    if (!statusMsg) return;
    statusMsg.textContent = msg || "";
    statusMsg.className = "status" + (type ? " " + type : "");
  }

  function toggleHidden(el, hide) {
    if (!el) return;
    if (hide) el.classList.add("hidden");
    else el.classList.remove("hidden");
  }

  function openScreen(name) {
    setStatus("", "");
    toggleHidden(loginForm, name !== "login");
    toggleHidden(registerForm, name !== "register");
    toggleHidden(forgotForm, name !== "forgot");
    toggleHidden(otpView, name !== "otp");
  }

  function renderPosts() {
    var posts = getPosts();
    var goodsEl = byId("goodsList");
    var elecEl = byId("electronicsList");

    var goods = posts.filter(function (p) { return p.category !== "ئەمەزۆن و ئەلیکترۆنی"; });
    var elec = posts.filter(function (p) { return p.category === "ئەمەزۆن و ئەلیکترۆنی"; });

    if (goodsEl) {
      goodsEl.innerHTML = goods.length
        ? goods.map(function (g) {
            return '<div class="item-card"><div class="item-title">' + g.title + '</div><div class="item-desc">' + (g.desc || "") + "</div></div>";
          }).join("")
        : '<div class="item-desc">هێشتا هیچ کاڵایەک زیاد نەکراوە.</div>';
    }

    if (elecEl) {
      elecEl.innerHTML = elec.length
        ? elec.map(function (item) {
            return '<div class="item-card"><div class="item-title">' + item.title + '</div><div class="item-desc">' + (item.desc || "") + "</div></div>";
          }).join("")
        : '<div class="item-desc">هێشتا هیچ بابەتێک لەم بەشەدا نییە.</div>';
    }
  }

  function enterMainApp(user) {
    if (activeUserLabel) activeUserLabel.textContent = user.name + " • " + user.email;
    toggleHidden(authShell, true);
    toggleHidden(mainAppShell, false);
    renderPosts();
  }

  function enterAuthScreen() {
    toggleHidden(mainAppShell, true);
    toggleHidden(authShell, false);
    openScreen("login");
  }

  function getExpiryString(mins) {
    var d = new Date(Date.now() + (mins || 15) * 60000);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function sendOtpEmail(email, code) {
    return fetch("https://api.emailjs.com/api/v1.0/email/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        service_id: EMAILJS_SERVICE_ID,
        template_id: EMAILJS_TEMPLATE_ID,
        user_id: EMAILJS_PUBLIC_KEY,
        template_params: {
          email: email,
          passcode: code,
          time: getExpiryString(15)
        }
      })
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (errText) {
          throw new Error("EmailJS (" + res.status + "): " + errText);
        });
      }
    });
  }

  function run30sCountdown() {
    clearInterval(timerId);
    var left = 30;
    if (resendBtn) {
      resendBtn.disabled = true;
      resendBtn.textContent = "دووبارە ناردنەوە (" + left + "s)";
    }

    timerId = setInterval(function () {
      left -= 1;
      if (!resendBtn) return;
      if (left > 0) {
        resendBtn.textContent = "دووبارە ناردنەوە (" + left + "s)";
      } else {
        clearInterval(timerId);
        resendBtn.disabled = false;
        resendBtn.textContent = "دووبارە ناردنەوەی کۆد";
      }
    }, 1000);
  }

  function triggerOtp(email, flow, payload, btn) {
    if (btn) btn.disabled = true;
    setStatus("خەریکی ناردنی کۆدی OTP بۆ ئیمەیڵ...", "");
    var code = String(Math.floor(100000 + Math.random() * 900000));

    sendOtpEmail(email, code)
      .then(function () {
        pendingFlow = flow;
        pendingPayload = payload;
        currentOtp = code;

        toggleHidden(resetFields, flow !== "reset");
        if (otpText) otpText.textContent = "کۆدی 6 خانەیی بۆ " + email + " نێردرا";
        openScreen("otp");
        for (var i = 0; i < otpInputs.length; i++) otpInputs[i].value = "";
        if (otpInputs[0]) otpInputs[0].focus();
        run30sCountdown();
        setStatus("کۆدەکە نێردرا؛ سەیری Inbox یان Spam بکە.", "ok");
      })
      .catch(function (e) {
        setStatus((e && e.message) ? e.message : "هەڵەیەک لە ناردنی ئیمەیڵدا ڕوویدا.", "err");
      })
      .finally(function () {
        if (btn) btn.disabled = false;
      });
  }

  document.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("button") : null;
    if (!btn) return;

    if (btn.id === "goRegisterBtn") {
      e.preventDefault();
      openScreen("register");
    } else if (btn.id === "goForgotBtn") {
      e.preventDefault();
      openScreen("forgot");
    } else if (btn.id === "goLoginFromRegBtn" || btn.id === "goLoginFromForgotBtn") {
      e.preventDefault();
      openScreen("login");
    } else if (btn.id === "cancelOtpBtn") {
      e.preventDefault();
      clearInterval(timerId);
      pendingFlow = null;
      pendingPayload = null;
      openScreen("login");
    } else if (btn.id === "logoutBtn") {
      e.preventDefault();
      clearSession();
      enterAuthScreen();
    } else if (btn.classList && btn.classList.contains("nav-btn")) {
      var navs = document.querySelectorAll(".nav-btn");
      for (var i = 0; i < navs.length; i++) navs[i].classList.remove("active");
      btn.classList.add("active");
      var tab = btn.getAttribute("data-tab");
      toggleHidden(byId("tab-goods"), tab !== "goods");
      toggleHidden(byId("tab-electronics"), tab !== "electronics");
      toggleHidden(byId("tab-support"), tab !== "support");
      var catInput = byId("postCategory");
      if (catInput) {
        catInput.value = tab === "electronics" ? "ئەمەزۆن و ئەلیکترۆنی" : "کاڵاکان";
      }
    }
  });

  if (loginForm) {
    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var emailEl = byId("loginEmail");
      var passEl = byId("loginPassword");
      var email = (emailEl ? emailEl.value : "").trim().toLowerCase();
      var password = passEl ? passEl.value : "";
      var users = getUsers();
      var found = null;
      for (var i = 0; i < users.length; i++) {
        if (users[i].email === email && users[i].password === password) {
          found = users[i];
          break;
        }
      }
      if (!found) {
        setStatus("ئیمەیڵ یان پاسۆرد هەڵەیە.", "err");
        return;
      }
      var sessionUser = { name: found.name, email: found.email };
      setSession(sessionUser);
      enterMainApp(sessionUser);
    });
  }

  if (registerForm) {
    registerForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var nameEl = byId("regName");
      var emailEl = byId("regEmail");
      var passEl = byId("regPassword");
      var name = (nameEl ? nameEl.value : "").trim();
      var email = (emailEl ? emailEl.value : "").trim().toLowerCase();
      var password = passEl ? passEl.value : "";

      var exists = getUsers().some(function (u) { return u.email === email; });
      if (exists) {
        setStatus("ئەم ئیمەیڵە پێشتر تۆمار کراوە.", "err");
        return;
      }
      triggerOtp(email, "register", { name: name, email: email, password: password }, byId("regBtn"));
    });
  }

  if (forgotForm) {
    forgotForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var emailEl = byId("forgotEmail");
      var email = (emailEl ? emailEl.value : "").trim().toLowerCase();
      var exists = getUsers().some(function (u) { return u.email === email; });
      if (!exists) {
        setStatus("هیچ هەژمارێک بەم ئیمەیڵە نەدۆزرایەوە.", "err");
        return;
      }
      triggerOtp(email, "reset", { email: email }, byId("forgotBtn"));
    });
  }

  if (resendBtn) {
    resendBtn.addEventListener("click", function () {
      if (resendBtn.disabled || !pendingPayload) return;
      triggerOtp(pendingPayload.email, pendingFlow, pendingPayload, resendBtn);
    });
  }

  var addPostForm = byId("addPostForm");
  if (addPostForm) {
    addPostForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var titleEl = byId("postTitle");
      var descEl = byId("postDesc");
      var catEl = byId("postCategory");
      var title = titleEl ? titleEl.value.trim() : "";
      var desc = descEl ? descEl.value.trim() : "";
      var category = catEl ? catEl.value : "کاڵاکان";
      if (!title) return;

      var list = getPosts();
      list.unshift({ title: title, desc: desc, category: category, at: Date.now() });
      savePosts(list);
      if (titleEl) titleEl.value = "";
      if (descEl) descEl.value = "";
      renderPosts();
    });
  }

  otpInputs.forEach(function (inp, i) {
    inp.addEventListener("input", function () {
      inp.value = inp.value.replace(/\D/g, "").slice(0, 1);
      if (inp.value && i < otpInputs.length - 1) otpInputs[i + 1].focus();
    });
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Backspace" && !inp.value && i > 0) otpInputs[i - 1].focus();
    });
    inp.addEventListener("paste", function (e) {
      e.preventDefault();
      var digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
      if (!digits) return;
      for (var k = 0; k < digits.length; k++) {
        if (otpInputs[k]) otpInputs[k].value = digits.charAt(k);
      }
      otpInputs[Math.min(digits.length, otpInputs.length - 1)].focus();
    });
  });

  var verifyOtpBtn = byId("verifyOtpBtn");
  if (verifyOtpBtn) {
    verifyOtpBtn.addEventListener("click", function () {
      var code = otpInputs.map(function (i) { return i.value; }).join("");
      if (code.length < 6 || code !== currentOtp) {
        if (otpBox) {
          otpBox.classList.remove("shake");
          void otpBox.offsetWidth;
          otpBox.classList.add("shake");
        }
        setStatus("کۆدی OTP هەڵەیە یان تەواو نییە.", "err");
        return;
      }

      var users = getUsers();
      if (pendingFlow === "register") {
        users.push(pendingPayload);
        saveUsers(users);
        var sessionUser = { name: pendingPayload.name, email: pendingPayload.email };
        setSession(sessionUser);
        clearInterval(timerId);
        enterMainApp(sessionUser);
      } else if (pendingFlow === "reset") {
        var p1El = byId("newPass");
        var p2El = byId("confirmPass");
        var p1 = p1El ? p1El.value : "";
        var p2 = p2El ? p2El.value : "";
        if (p1.length < 6) {
          setStatus("پاسۆردی نوێ دەبێت لانیکەم 6 پیت یان ژمارە بێت.", "err");
          return;
        }
        if (p1 !== p2) {
          setStatus("هەردوو پاسۆردە نوێیەکە وەک یەک نین.", "err");
          return;
        }
        for (var i = 0; i < users.length; i++) {
          if (users[i].email === pendingPayload.email) {
            users[i].password = p1;
            break;
          }
        }
        saveUsers(users);
        clearInterval(timerId);
        setStatus("پاسۆردەکەت گۆڕدرا؛ ئێستا دەتوانیت بچیتە ژوورەوە.", "ok");
        setTimeout(function () { openScreen("login"); }, 1200);
      }
    });
  }

  var existingSession = getSession();
  if (existingSession && existingSession.email) {
    enterMainApp(existingSession);
  } else {
    enterAuthScreen();
  }
})();
</script>
