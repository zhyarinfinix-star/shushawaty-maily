<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shushawaty Maily</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0e4656" />
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body {
      margin: 0; min-height: 100vh; color: #0f172a; padding: 16px 14px 96px;
      background:
        radial-gradient(circle at 12% 14%, rgba(255, 209, 92, 0.52), transparent 40%),
        radial-gradient(circle at 88% 18%, rgba(45, 212, 191, 0.42), transparent 44%),
        linear-gradient(150deg, #071e28 0%, #0e4656 50%, #172742 100%);
      background-attachment: fixed;
    }
    .box {
      max-width: 620px; margin: 0 auto 14px; border-radius: 24px; padding: 16px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
    }
    .hero {
      text-align: center; color: #fff; padding: 20px 16px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.45);
    }
    input, textarea {
      width: 100%; padding: 11px 14px; margin-bottom: 10px;
      border-radius: 14px; border: 1px solid #cbd5e1;
      background: rgba(255, 255, 255, 0.94); font-size: 14px;
    }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 14px;
      font-weight: bold; font-size: 14px; cursor: pointer;
    }
    .b1 { background: #0f5c70; color: #fff; }
    .b2 { background: linear-gradient(135deg, #ffe38a, #d49b1a); color: #0f172a; }
    .b3 { background: rgba(255, 255, 255, 0.78); color: #0f4c5c; margin-top: 8px; }
    .del { background: #fee2e2; color: #991b1b; width: auto; padding: 7px 14px; border-radius: 12px; font-size: 12px; }
    .edt { background: #e0f2fe; color: #0c4a6e; width: auto; padding: 7px 14px; border-radius: 12px; font-size: 12px; }
    .row-btn { display: flex; gap: 8px; margin-top: 10px; }
    .otp { background: #e0f2fe; color: #0c4a6e; padding: 11px; border-radius: 14px; text-align: center; font-weight: bold; margin-bottom: 10px; }
    .err { color: #b91c1c; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
    .img { width: 100%; height: 220px; object-fit: cover; border-radius: 16px; margin-bottom: 8px; cursor: zoom-in; }
    .thumbs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 8px; }
    .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
    .thumb.on { border-color: #d49b1a; }
    .soc-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .soc {
      display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px;
      border-radius: 16px; text-decoration: none; color: #0f172a; font-weight: bold; font-size: 13px;
      background: rgba(255, 255, 255, 0.74); border: 1px solid rgba(255, 255, 255, 0.9);
    }
    .nav {
      position: fixed; bottom: 12px; left: 12px; right: 12px; max-width: 620px; margin: 0 auto;
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(18px);
      border-radius: 20px; padding: 6px; display: flex; gap: 8px; z-index: 30;
    }
    .nav button { background: transparent; color: #334155; }
    .nav button.on { background: #0f5c70; color: #fff; }
    .lb {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 99;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px;
    }
    .lb img { max-width: 100%; max-height: 70vh; border-radius: 14px; }
    .hide { display: none !important; }
  </style>
</head>
<body>

  <div id="loginBox">
    <div class="box hero">
      <h2 style="margin:0 0 4px;">Shushawaty Maily</h2>
      <div style="font-size:13px;">شووشەواتی مەیلی</div>
    </div>

    <div id="step1" class="box">
      <h3 style="margin-top:0;">چوونەژوورەوە بە ئیمەیڵ</h3>
      <input id="mailInp" type="email" placeholder="ئیمەیڵ بنووسە" />
      <div id="err1" class="err hide"></div>
      <button id="sendBtn" type="button" class="b1">ناردنی کۆدی OTP</button>
    </div>

    <div id="step2" class="box hide">
      <h3 style="margin-top:0;">پشتڕاستکردنەوەی OTP</h3>
      <div id="whoMail" style="font-size:13px;margin-bottom:8px;"></div>
      <div id="codeShow" class="otp"></div>
      <input id="codeInp" type="text" placeholder="کۆدەکە بنووسە" />
      <div id="err2" class="err hide"></div>
      <button id="verifyBtn" type="button" class="b2">چوونەژوورەوە</button>
      <button id="backBtn" type="button" class="b3">گۆڕینی ئیمەیڵ</button>
    </div>
  </div>

  <div id="mainBox" class="hide">
    <div class="box hero">
      <h3 style="margin:0 0 4px;">Shushawaty Maily</h3>
      <div id="userShow" style="font-size:12px;"></div>
      <button id="outBtn" type="button" class="del" style="margin-top:10px;">چوونەدەرەوە</button>
    </div>

    <div id="tabShop">
      <div class="box" style="padding:12px;">
        <input id="srch" type="text" placeholder="گەڕان..." style="margin-bottom:0;" />
      </div>

      <div id="adminBox" class="box hide">
        <h4 id="fTitle" style="margin-top:0;">زیادکردنی کاڵا</h4>
        <input id="pName" type="text" placeholder="ناوی کاڵا" />
        <textarea id="pDesc" rows="2" placeholder="زانیاری"></textarea>
        <input id="pPrice" type="text" placeholder="نرخ" />
        <input id="pImg" type="file" accept="image/*" multiple />
        <button id="pubBtn" type="button" class="b2">بڵاوکردنەوە</button>
        <button id="cancelBtn" type="button" class="b3 hide">هەڵوەشاندنەوە</button>
      </div>

      <div id="postsArea"></div>
    </div>

    <div id="tabInfo" class="box hide">
      <h3 style="margin-top:0;">ئینفۆرمەیشن</h3>
      <p><b>ناونیشان:</b> سۆران ڕواندز تەنیشت پیزای مییر</p>
      <p><b>پەیوەندی:</b> <bdi dir="ltr">07824463372</bdi> / <bdi dir="ltr">07504619938</bdi></p>
      <div class="soc-row">
        <a class="soc" href="https://www.snapchat.com/add/shushawat_mayle?share_id=55QsI_mJz5s&locale=en-US" target="_blank">Snapchat</a>
        <a class="soc" href="https://www.facebook.com/share/19sUWyg8bB/" target="_blank">Facebook</a>
        <a class="soc" href="https://www.tiktok.com/" target="_blank">TikTok</a>
      </div>
    </div>

    <div class="nav">
      <button id="bShop" type="button" class="on">کاڵاکان</button>
      <button id="bInfo" type="button">ئینفۆرمەیشن</button>
    </div>
  </div>

  <div id="lbBox" class="lb hide">
    <div style="width:100%;max-width:600px;display:flex;justify-content:space-between;color:#fff;margin-bottom:8px;">
      <span id="lbNum">1 / 1</span>
      <button id="lbClose" type="button" class="del" style="background:#fff;color:#000;">داخستن</button>
    </div>
    <img id="lbPic" src="" alt="" />
    <div id="lbNav" style="display:flex;gap:10px;margin-top:12px;width:240px;">
      <button id="lbPrev" type="button" class="b3">پێشوو</button>
      <button id="lbNext" type="button" class="b3">دواتر</button>
    </div>
  </div>

  <script>
    var DB = 'https://shushawaty-maily-default-rtdb.firebaseio.com';
    var ADMIN = 'zhyarinfinix@gmail.com';
    var SKEY = 'sm_session_v3';
    var otp = '';
    var mail = '';
    var posts = [];
    var editKey = null;
    var lbList = [];
    var lbIdx = 0;

    function getImgs(p) {
      if (p && p.imgs && p.imgs.length) return p.imgs;
      if (p && p.img) return [p.img];
      return ['https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=600'];
    }

    function goTab(t) {
      var isInfo = (t === 'info');
      document.getElementById('tabShop').className = isInfo ? 'hide' : '';
      document.getElementById('tabInfo').className = isInfo ? 'box' : 'box hide';
      document.getElementById('bShop').className = isInfo ? '' : 'on';
      document.getElementById('bInfo').className = isInfo ? 'on' : '';
    }

    function openApp(m) {
      mail = String(m || '').trim().toLowerCase();
      if (!mail) return;
      try { localStorage.setItem(SKEY, mail); } catch (e) {}
      document.getElementById('loginBox').className = 'hide';
      document.getElementById('mainBox').className = '';
      document.getElementById('userShow').textContent = 'هەژمار: ' + mail;
      document.getElementById('adminBox').className = (mail === ADMIN) ? 'box' : 'box hide';
      goTab('shop');
      loadPosts();
    }

    function sendCode() {
      var m = (document.getElementById('mailInp').value || '').trim().toLowerCase();
      var e1 = document.getElementById('err1');
      if (!m || m.indexOf('@') < 1) {
        e1.textContent = 'ئیمەیڵێکی دروست بنووسە';
        e1.className = 'err';
        return;
      }
      e1.className = 'err hide';
      mail = m;
      otp = String(Math.floor(100000 + Math.random() * 900000));
      document.getElementById('whoMail').textContent = 'ئیمەیڵ: ' + mail;
      document.getElementById('codeShow').textContent = 'کۆدی OTP: ' + otp;
      document.getElementById('codeInp').value = '';
      document.getElementById('err2').className = 'err hide';
      document.getElementById('step1').className = 'box hide';
      document.getElementById('step2').className = 'box';
    }

    function checkCode() {
      var c = (document.getElementById('codeInp').value || '').trim();
      var e2 = document.getElementById('err2');
      if (!c || (otp && c !== otp)) {
        e2.textContent = 'کۆدەکە هەڵەیە';
        e2.className = 'err';
        return;
      }
      e2.className = 'err hide';
      openApp(mail || ADMIN);
    }

    function backMail() {
      document.getElementById('step2').className = 'box hide';
      document.getElementById('step1').className = 'box';
    }

    function logOut() {
      try { localStorage.removeItem(SKEY); } catch (e) {}
      resetEdit();
      mail = ''; otp = '';
      document.getElementById('mainBox').className = 'hide';
      document.getElementById('step2').className = 'box hide';
      document.getElementById('step1').className = 'box';
      document.getElementById('loginBox').className = '';
    }

    function resetEdit() {
      editKey = null;
      document.getElementById('fTitle').textContent = 'زیادکردنی کاڵا';
      document.getElementById('pName').value = '';
      document.getElementById('pDesc').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pImg').value = '';
      document.getElementById('pubBtn').textContent = 'بڵاوکردنەوە';
      document.getElementById('cancelBtn').className = 'b3 hide';
    }

    function startEdit(k) {
      if (mail !== ADMIN) return;
      for (var i = 0; i < posts.length; i++) {
        if (posts[i]._k === k) {
          editKey = k;
          document.getElementById('fTitle').textContent = 'دەستکاریی کاڵا';
          document.getElementById('pName').value = posts[i].name || '';
          document.getElementById('pDesc').value = posts[i].desc || '';
          document.getElementById('pPrice').value = posts[i].price || '';
          document.getElementById('pImg').value = '';
          document.getElementById('pubBtn').textContent = 'پاشەکەوتکردن';
          document.getElementById('cancelBtn').className = 'b3';
          window.scrollTo(0, 0);
          return;
        }
      }
    }

    function shrinkImg(file, cb) {
      var r = new FileReader();
      r.onload = function (ev) {
        var im = new Image();
        im.onload = function () {
          var w = im.width > 640 ? 640 : im.width;
          var h = Math.round(im.height * (w / im.width));
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(im, 0, 0, w, h);
          cb(cv.toDataURL('image/jpeg', 0.65));
        };
        im.onerror = function () { cb('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=600'); };
        im.src = ev.target.result;
      };
      r.readAsDataURL(file);
    }

    function shrinkMany(files, cb) {
      var arr = [];
      var n = Math.min(files.length, 6);
      function step(i) {
        if (i >= n) return cb(arr);
        shrinkImg(files[i], function (u) { arr.push(u); step(i + 1); });
      }
      step(0);
    }

    function savePost() {
      if (mail !== ADMIN) return;
      var name = (document.getElementById('pName').value || '').trim();
      var desc = (document.getElementById('pDesc').value || '').trim();
      var price = (document.getElementById('pPrice').value || '').trim();
      var fl = document.getElementById('pImg').files;
      var btn = document.getElementById('pubBtn');
      if (!name || !price) return;

      btn.disabled = true;
      btn.textContent = 'چاوەڕێ بکە...';

      var old = null;
      if (editKey) {
        for (var i = 0; i < posts.length; i++) {
          if (posts[i]._k === editKey) { old = posts[i]; break; }
        }
      }

      function pushData(list) {
        var body = {
          id: old ? old.id : Date.now(),
          name: name, desc: desc, price: price,
          img: list[0], imgs: list
        };
        var url = editKey ? (DB + '/products/' + editKey + '.json') : (DB + '/products.json');
        var method = editKey ? 'PUT' : 'POST';
        fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
          .then(function () { btn.disabled = false; resetEdit(); loadPosts(); })
          .catch(function () { btn.disabled = false; btn.textContent = 'بڵاوکردنەوە'; });
      }

      if (fl && fl.length > 0) shrinkMany(fl, pushData);
      else pushData(old ? getImgs(old) : ['https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=600']);
    }

    function delPost(k) {
      if (mail !== ADMIN || !k) return;
      if (editKey === k) resetEdit();
      fetch(DB + '/products/' + k + '.json', { method: 'DELETE' }).then(function () { loadPosts(); });
    }

    function loadPosts() {
      document.getElementById('postsArea').innerHTML = '<div class="box" style="text-align:center;">چاوەڕێ بکە...</div>';
      fetch(DB + '/products.json')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var arr = [];
          if (d && typeof d === 'object') {
            var ks = Object.keys(d);
            for (var i = 0; i < ks.length; i++) {
              if (d[ks[i]]) {
                var item = d[ks[i]];
                item._k = ks[i];
                arr.push(item);
              }
            }
          }
          arr.sort(function (a, b) { return (b.id || 0) - (a.id || 0); });
          posts = arr;
          drawPosts();
        })
        .catch(function () { posts = []; drawPosts(); });
    }

    function pickThumb(k, idx) {
      for (var i = 0; i < posts.length; i++) {
        if (posts[i]._k === k) {
          var imgs = getImgs(posts[i]);
          var main = document.getElementById('mimg-' + k);
          if (main && imgs[idx]) { main.src = imgs[idx]; main.setAttribute('data-i', idx); }
          for (var j = 0; j < imgs.length; j++) {
            var th = document.getElementById('th-' + k + '-' + j);
            if (th) th.className = (j === idx) ? 'thumb on' : 'thumb';
          }
          return;
        }
      }
    }

    function openLb(k) {
      for (var i = 0; i < posts.length; i++) {
        if (posts[i]._k === k) {
          lbList = getImgs(posts[i]);
          var main = document.getElementById('mimg-' + k);
          lbIdx = main ? (parseInt(main.getAttribute('data-i') || '0', 10) || 0) : 0;
          showLb();
          document.getElementById('lbBox').className = 'lb';
          return;
        }
      }
    }

    function showLb() {
      document.getElementById('lbPic').src = lbList[lbIdx] || '';
      document.getElementById('lbNum').textContent = (lbIdx + 1) + ' / ' + lbList.length;
      document.getElementById('lbNav').style.display = lbList.length > 1 ? 'flex' : 'none';
    }

    function drawPosts() {
      var q = (document.getElementById('srch').value || '').trim().toLowerCase();
      var html = '';
      for (var i = 0; i < posts.length; i++) {
        var p = posts[i];
        var s = ((p.name || '') + ' ' + (p.desc || '') + ' ' + (p.price || '')).toLowerCase();
        if (q && s.indexOf(q) === -1) continue;
        var imgs = getImgs(p);
        var thHtml = '';
        if (imgs.length > 1) {
          thHtml = '<div class="thumbs">';
          for (var j = 0; j < imgs.length; j++) {
            thHtml += '<img id="th-' + p._k + '-' + j + '" class="thumb ' + (j === 0 ? 'on' : '') + '" src="' + imgs[j] + '" onclick="pickThumb(\'' + p._k + '\',' + j + ')" alt="" />';
          }
          thHtml += '</div>';
        }
        html += '<div class="box">' +
          '<img id="mimg-' + p._k + '" data-i="0" class="img" src="' + imgs[0] + '" onclick="openLb(\'' + p._k + '\')" alt="" />' +
          thHtml +
          '<h4 style="margin:4px 0;">' + (p.name || '') + '</h4>' +
          '<div style="font-weight:bold;color:#92400e;margin-bottom:4px;">نرخ: ' + (p.price || '') + '</div>' +
          '<div style="color:#334155;">' + (p.desc || '') + '</div>' +
          (mail === ADMIN ? (
            '<div class="row-btn">' +
              '<button type="button" class="edt" onclick="startEdit(\'' + p._k + '\')">ئیدیت</button>' +
              '<button type="button" class="del" onclick="delPost(\'' + p._k + '\')">سڕینەوە</button>' +
            '</div>'
          ) : '') +
          '</div>';
      }
      document.getElementById('postsArea').innerHTML = html || '<div class="box" style="text-align:center;">هیچ کاڵایەک نییە</div>';
    }

    document.getElementById('sendBtn').onclick = sendCode;
    document.getElementById('verifyBtn').onclick = checkCode;
    document.getElementById('backBtn').onclick = backMail;
    document.getElementById('outBtn').onclick = logOut;
    document.getElementById('pubBtn').onclick = savePost;
    document.getElementById('cancelBtn').onclick = resetEdit;
    document.getElementById('srch').oninput = drawPosts;
    document.getElementById('bShop').onclick = function () { goTab('shop'); };
    document.getElementById('bInfo').onclick = function () { goTab('info'); };
    document.getElementById('lbClose').onclick = function () { document.getElementById('lbBox').className = 'lb hide'; };
    document.getElementById('lbPrev').onclick = function () { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; showLb(); };
    document.getElementById('lbNext').onclick = function () { lbIdx = (lbIdx + 1) % lbList.length; showLb(); };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }

    try {
      var saved = localStorage.getItem(SKEY);
      if (saved && saved.indexOf('@') > 0) openApp(saved);
    } catch (e) {}
  </script>
</body>
</html>
