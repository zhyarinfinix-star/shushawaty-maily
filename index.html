<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shushawaty Maily | شووشەواتی مەیلی</title>
  <style>
    :root {
      --gold: #ffd15c;
      --gold-deep: #d49b1a;
      --ink: #0f172a;
      --muted: #334155;
    }

    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      padding: 16px 14px 98px;
      background:
        radial-gradient(circle at 12% 14%, rgba(255, 209, 92, 0.52), transparent 40%),
        radial-gradient(circle at 88% 18%, rgba(45, 212, 191, 0.42), transparent 44%),
        radial-gradient(circle at 20% 82%, rgba(56, 189, 248, 0.38), transparent 46%),
        radial-gradient(circle at 85% 86%, rgba(168, 85, 247, 0.25), transparent 45%),
        linear-gradient(150deg, #071e28 0%, #0e4656 50%, #172742 100%);
      background-attachment: fixed;
    }

    .box {
      max-width: 620px;
      margin: 0 auto 15px;
      border-radius: 26px;
      padding: 18px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.64));
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow:
        0 14px 32px rgba(3, 12, 24, 0.24),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.95);
    }

    .hero {
      text-align: center;
      color: #ffffff;
      padding: 22px 18px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08));
      border: 1px solid rgba(255, 255, 255, 0.48);
      box-shadow:
        0 18px 38px rgba(0, 0, 0, 0.34),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.55);
    }

    .logo-ring {
      width: 78px;
      height: 78px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.72), rgba(255, 209, 92, 0.35) 58%, rgba(14, 70, 86, 0.8) 100%);
      border: 2px solid rgba(255, 232, 150, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.3),
        0 0 22px rgba(255, 209, 92, 0.35),
        inset 0 2px 6px rgba(255, 255, 255, 0.8);
    }

    .account-pill {
      display: inline-block;
      margin-top: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      color: #fff8dc;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.28);
    }

    input, textarea {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 11px;
      border-radius: 16px;
      border: 1px solid rgba(15, 23, 42, 0.14);
      background: rgba(255, 255, 255, 0.86);
      font-size: 14px;
      color: var(--ink);
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 16px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .btn1 {
      background: linear-gradient(135deg, #0f5c70, #16829b);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    .btn2 {
      background: linear-gradient(135deg, #ffe38a, var(--gold), var(--gold-deep));
      color: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.65);
    }

    .btn3 {
      background: rgba(255, 255, 255, 0.72);
      color: #0f4c5c;
      border: 1px solid rgba(15, 76, 92, 0.25);
      margin-top: 8px;
    }

    .admin-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .edit-btn {
      width: auto;
      padding: 8px 16px;
      border-radius: 13px;
      font-size: 12px;
      background: linear-gradient(135deg, rgba(224, 242, 254, 0.95), rgba(186, 230, 253, 0.9));
      color: #0c4a6e;
      border: 1px solid rgba(14, 116, 144, 0.3);
    }

    .del {
      background: linear-gradient(135deg, rgba(254, 202, 202, 0.95), rgba(254, 226, 226, 0.9));
      color: #991b1b;
      border: 1px solid rgba(185, 28, 28, 0.28);
      width: auto;
      padding: 8px 16px;
      border-radius: 13px;
      font-size: 12px;
    }

    .otp {
      background: rgba(224, 242, 254, 0.9);
      border: 1.5px dashed rgba(14, 116, 144, 0.45);
      color: #0c4a6e;
      padding: 12px;
      border-radius: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .err {
      color: #b91c1c;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .img-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      display: block;
      cursor: zoom-in;
    }

    .zoom-hint {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.68);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      pointer-events: none;
    }

    .thumbs-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 8px;
      margin-bottom: 6px;
    }

    .thumb-item {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0.75;
      transition: transform 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
    }

    .thumb-item.active {
      opacity: 1;
      border-color: var(--gold-deep);
      transform: scale(1.04);
    }

    .price-tag {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 13px;
      color: #78350f;
      background: rgba(255, 209, 92, 0.35);
      border: 1px solid rgba(212, 155, 26, 0.4);
      margin-bottom: 8px;
    }

    .info-row {
      padding: 10px 12px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.82);
      margin-bottom: 10px;
      font-size: 14px;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .social-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 14px 8px;
      border-radius: 20px;
      text-decoration: none;
      color: #0f172a;
      font-weight: bold;
      font-size: 13px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.52));
      border: 1px solid rgba(255, 255, 255, 0.92);
    }

    .s-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .s-snap { background: linear-gradient(135deg, #fff04d, #facc15); color: #111827; }
    .s-fb { background: linear-gradient(135deg, #2589ff, #1266d8); color: #ffffff; }
    .s-tt { background: linear-gradient(135deg, #18181b, #27272a); color: #ffffff; }

    .nav {
      position: fixed;
      bottom: 14px;
      left: 14px;
      right: 14px;
      max-width: 620px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.84);

    .nav button { background: transparent; color: #334155; border-radius: 16px; padding: 11px 8px; }
    .nav button.on { background: linear-gradient(135deg, #0f5c70, #16829b); color: #ffffff; }

    /* Lightbox بۆ بینینی وێنە بە گەورەیی */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(5, 12, 22, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .lb-top {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .lb-close {
      width: auto;
      padding: 8px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-size: 13px;
    }

    .lb-img {
      max-width: 100%;
      max-height: 68vh;
      border-radius: 18px;
      object-fit: contain;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);

    .lb-controls {

    .lb-btn {

      border-radius: 14px;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .hide { display: none !important; }
  </style>
</head>

  <script>
    var DB_URL = 'https://shushawaty-maily-default-rtdb.firebaseio.com'.replace(/\/+$/, '');
    var ADMIN = 'zhyarinfinix@gmail.com';
    var otpNow = '';
    var mailNow = '';
    var posts = [];
    var editingKey = null;
    var lbImages = [];
    var lbIndex = 0;

    function getPostImages(p) {
      if (Array.isArray(p.imgs) && p.imgs.length > 0) return p.imgs;
      if (p.img) return [p.img];
      return ['https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=600'];
    }

    function loadPostsFromCloud() {
      fetch(DB_URL + '/products.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var arr = [];
          if (data && typeof data === 'object') {
            Object.keys(data).forEach(function(k) {
              if (data[k]) {
                var item = data[k];
                item._key = k;
                arr.push(item);
              }
            });
          }
          arr.sort(function(a, b) { return (b.id || 0) - (a.id || 0); });
          posts = arr;
          drawPosts();
        })
        .catch(function() {
          document.getElementById('postsArea').innerHTML = '<div class="box" style="text-align:center;">هەڵەیەک لە هێنانی کاڵاکان ڕوویدا.</div>';
        });
    }

    function compressOneImage(file) {
      return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          var img = new Image();
          img.onload = function() {
            var maxW = 680;
            var scale = img.width > maxW ? (maxW / img.width) : 1;
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.68));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function sendCode() {
      var m = document.getElementById('mailInp').value.trim().toLowerCase();
      var e1 = document.getElementById('err1');
      if (!m || m.indexOf('@') < 1) {
        e1.textContent = 'ئیمەیڵێکی دروست بنووسە';
        e1.className = 'err';
        return;
      }
      e1.className = 'err hide';
      mailNow = m;
      otpNow = String(Math.floor(100000 + Math.random() * 900000));
      document.getElementById('whoMail').textContent = 'ئیمەیڵ: ' + mailNow;
      document.getElementById('codeShow').textContent = 'کۆدی OTP: ' + otpNow;
      document.getElementById('codeInp').value = '';
      document.getElementById('step1').className = 'box hide';
      document.getElementById('step2').className = 'box';
    }

    function backStep1() {
      document.getElementById('step2').className = 'box hide';
      document.getElementById('step1').className = 'box';
    }

    function checkCode() {
      var c = document.getElementById('codeInp').value.trim();
      var e2 = document.getElementById('err2');
      if (!c || c !== otpNow) {
        e2.textContent = 'کۆدەکە هەڵەیە';
        e2.className = 'err';
        return;
      }
      e2.className = 'err hide';
      try { localStorage.setItem('sm_user_simple', mailNow); } catch(e) {}
      enterMain(mailNow);
    }

    function enterMain(m) {
      mailNow = m;
      document.getElementById('loginBox').className = 'hide';
      document.getElementById('mainBox').className = '';
